<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101d"><title>페이지를 찾을 수 없습니다 — LocalWebAI Lab</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 70% 10%,#12365a 0,transparent 36rem),#06101d;color:#f3f8ff;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}.card{width:min(680px,100%);padding:clamp(24px,5vw,42px);background:#0c2032;border:1px solid #1f4664;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.38)}.eyeline{color:#42e8ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(38px,8vw,70px);line-height:1;letter-spacing:-.055em;margin:12px 0 18px}p{color:#9eb6c8;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:24px}.button{min-height:44px;padding:0 16px;border:1px solid #1f4664;border-radius:10px;background:#0e2940;color:#fff;font:inherit;font-weight:800;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,#0ab7ff,#3076ff);border-color:transparent}.button:focus-visible{outline:3px solid rgba(66,232,255,.3);outline-offset:2px}</style></head><body><main class="card"><div class="eyeline">404 · Not Found</div><h1>요청한 페이지를<br>찾을 수 없습니다.</h1><p>주소가 바뀌었거나 존재하지 않는 경로입니다. LocalWebAI Lab 홈으로 돌아가거나 이전 페이지로 이동하세요.</p><div class="actions"><a id="home-link" class="button primary" href="/">홈으로 이동</a><button class="button" onclick="history.length>1?history.back():location.assign(document.getElementById('home-link').href)">이전 페이지</button></div></main><script>const parts=location.pathname.split('/').filter(Boolean);const root=location.hostname.endsWith('github.io')&&parts.length?'/'+parts[0]+'/':'/';document.getElementById('home-link').href=root;</script></body></html>
